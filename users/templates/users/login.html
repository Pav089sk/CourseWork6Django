{% extends 'mailing/base.html' %}

{% block content %}
  <h2>Вход</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
    {% if not user.is_authenticated %}
    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
    {% endif %}
  </form>
{% endblock %}
