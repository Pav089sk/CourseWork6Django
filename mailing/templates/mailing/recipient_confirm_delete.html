{% extends 'mailing/base.html' %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm border-danger">
  <h3 class="text-danger">Подтверждение удаления клиента</h3>
  <p>Вы действительно хотите удалить получателя {{ object.email }}? Это действие нельзя отменить.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:recipient_detail' pk=object.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
