{% extends 'mailing/base.html' %}

{% block content %}
<h2>Пользователи</h2>
<table border="1" cellpadding="8" style="border-collapse: collapse;">
  <tr>
    <th>Email</th>
    <th>Статус</th>
    <th>Действие</th>
  </tr>
  {% for u in users %}
  <tr>
    <td>{{ u.email }}</td>
    <td>{% if u.is_active %}Активен{% else %}Заблокирован{% endif %}</td>
    <td>
      <form method="post" action="{% url 'mailing:toggle_user_block' u.pk %}">
        {% csrf_token %}
        <button type="submit">
          {% if u.is_active %}Заблокировать{% else %}Разблокировать{% endif %}
        </button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
