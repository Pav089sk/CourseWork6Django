<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
</head>
<body>
    <header style="padding: 10px; border-bottom: 1px solid #ccc; margin-bottom: 20px;">
        <h1>Сервис управления рассылками</h1>

        <!-- Блок навигации и авторизации -->
        <nav>
            {% if user.is_authenticated %}
                <span>Привет, {{ user.username }}!</span> |
                <a href="{% url 'mailing:messenger_create' %}">Создать рассылку</a> |
                <a href="{% url 'mailing:recipient_list' %}">Клиенты</a> |
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:red; cursor:pointer;">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a> |
                <a href="#">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="margin-top: 30px; padding: 10px; color: #777;">
        &copy; 2026 Сервис рассылок.
    </footer>
</body>
</html>
