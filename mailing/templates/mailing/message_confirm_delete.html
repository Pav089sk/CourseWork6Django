{% extends 'mailing/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm border-danger">
  <h3 class="text-danger">Подтверждение удаления</h3>
  <p>Вы действительно хотите удалить сообщение «{{ object.theme }}»? Это действие нельзя отменить.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:message_detail' pk=object.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
