{% extends 'mailing/base.html' %}

{% block title %}Сообщение: {{ message.theme }}{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm">
  <h2 class="card-title">{{ message.theme }}</h2>
  <hr>

  <div class="mb-3">
    <label class="form-label">Текст сообщения</label>
    <pre class="bg-light p-3 rounded">{{ message.content }}</pre>
  </div>

  <div class="d-flex gap-2">
    <a href="{% url 'mailing:message_update' pk=message.pk %}" class="btn btn-primary">Редактировать</a>
    <a href="{% url 'mailing:message_delete' pk=message.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Назад к списку</a>
  </div>
</div>
{% endblock %}
