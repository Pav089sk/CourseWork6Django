{% extends 'mailing/base.html' %}

{% block title %}{{ title|default:'Новое письмо' }}{% endblock %}

{% block content %}
<h1>{{ title|default:'Новое письмо' }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">{{ submit_label|default:'Сохранить' }}</button>
  <a href="{% url 'mailing:list_messenger' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
